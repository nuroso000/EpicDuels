# ============================================================================
#   EpicDuels — Messages (English)
# ============================================================================
#
# Format: MiniMessage — https://docs.advntr.dev/minimessage/format.html
#   <green>text</green>, <bold>, <gray>, <click:run_command:'/cmd'>, ...
# Placeholders like <player>, <kit>, <arena> are filled in by the plugin.
#
# This file is extracted to plugins/EpicDuels/lang/ on first start and can be
# edited freely. Missing keys fall back to the built-in English defaults.
# Apply changes with /duel reload.
#
# ============================================================================

